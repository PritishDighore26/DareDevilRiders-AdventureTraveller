<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="validation.js"></script>
</head>
<body>
    <div class="login-container" >
    <a href="#" class="logologin">DareDevilRiders</a>
    <div class="signin">
        <h2 class="lh2">Sign Up</h2>
        <form action="" method="post">
                <input class="inputs" type="text" name="fname" id="fname" placeholder="First Name" required><br>
                <input class="inputs"type="text" name="lname" id="lname" placeholder="Last name" required><br>
                <input class="inputs"type="email" name="email" id="email" placeholder="xyz@gmail.com"><br>
                <input class="inputs"type="number" name="phone" id="phone" placeholder="Phone Number"><br>
                <label for="dob" class="doblabel">Date of Birth:</label>
                <input class="date" type="date" name="dob" id="dob" placeholder="Date of Birth"><br>
                <div class="gender-group">
                <label for="gender" class="genderlabel">Gender:</label>
                <input class="input" type="radio" name="gender" id="gender" value="male"> Male
                <input class="input" type="radio" name="gender" id="gender" value="female"> Female 
                <input class="input" type="radio" name="gender" id="gender" value="fimale">Other<br>
                </div>   
                <textarea class="address" name="address" id="address" cols="30" rows="2" placeholder="Address" ></textarea>         
                <input class="inputs"type="password" name="pass" id="pass" placeholder=" 8+ characher"><br>
                <input class="inputs"type="password" name="cpass" id="cpass" placeholder="Same as Password"><br>
                <button type="submit"class="btn3" onclick="validateform()">Register</button></td>
            <p>
      <input type="checkbox"> By continuing, I agree to the terms of <br>use & privacy policy.
    </p>
    <p>Already have an account? <a href="Login.html" class="text-color">Login here</a></p>
        </form>
    </div>
    </div>
</body>
</html>
